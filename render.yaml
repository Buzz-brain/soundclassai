services:
  - type: web
    name: sound-classifier
    runtime: python
    pythonVersion: 3.11.0
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 180 app:app
    healthCheckPath: /api/model-info
    envVars:
      - key: PYTHONUNBUFFERED
        value: true
      - key: PYTHONWARNINGS
        value: ignore
